<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ひみつのことば | もじクイズ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#CFF3E1; --mint-d:#3FAE83;
    --lav:#E3DAF7; --lav-d:#8A6FE0;
    --lemon:#FFF6C2; --lemon-d:#E0B400;
    --sakura:#FFDCE9; --sakura-d:#FF6F91;
    --sky:#D6EEFB; --sky-d:#3FA3E0;
    --ink:#4A3B4E;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#FFE9F2 0%, #E3F2FF 35%, #FFF9DA 70%, #E6FFF1 100%);
    background-attachment:fixed;
  }
  .screen{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .panel{
    width:100%; max-width:920px;
    background:rgba(255,255,255,0.9);
    border-radius:40px;
    box-shadow:0 20px 50px rgba(120,90,120,0.18);
    padding:34px 28px;
    position:relative;
    overflow:hidden;
  }
  .btn-round{
    border-radius:28px; border:none; cursor:pointer;
    font-family:inherit; font-weight:700;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-round:active{ transform:translateY(4px); }
  .mode-card{
    border-radius:32px; padding:22px 16px; text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,0.08);
    cursor:pointer; border:none; font-family:inherit;
    transition:transform .1s ease;
    display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .mode-card:hover{ transform:translateY(-4px); }
  .mode-card:active{ transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,0.08); }
  .word-chip{
    background:#fff; border-radius:20px; padding:10px 14px;
    box-shadow:0 4px 0 rgba(0,0,0,0.06);
    min-width:96px; text-align:center;
  }
  .choice-btn{
    background:#fff; border-radius:24px; padding:20px 10px;
    font-size:28px; font-weight:900; box-shadow:0 6px 0 #ddd;
    border:3px solid transparent;
  }
  .choice-btn.correct{ background:#DFF7E8; border-color:var(--mint-d); color:var(--mint-d); }
  .choice-btn.wrong{ background:#FFE1E1; border-color:#E05D5D; color:#E05D5D; }
  .fx-overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:50;
  }
  .fx-mark{
    font-size:220px; font-weight:900; opacity:0;
  }
  .fx-mark.show{ animation:pop .9s ease forwards; }
  @keyframes pop{
    0%{ opacity:0; transform:scale(0.3) rotate(-8deg); }
    30%{ opacity:1; transform:scale(1.15) rotate(4deg); }
    50%{ opacity:1; transform:scale(1) rotate(0); }
    80%{ opacity:1; }
    100%{ opacity:0; transform:scale(1); }
  }
  .confetti{ position:fixed; top:-20px; z-index:40; border-radius:3px; pointer-events:none; }
  .speak-btn{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--sky-d); color:#fff; font-size:24px;
    box-shadow:0 5px 0 #2C82B5; display:flex; align-items:center; justify-content:center;
  }
  .speak-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 #2C82B5; }
  .progress-bar{ height:10px; border-radius:8px; background:#eee; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--sakura-d); transition:width .3s ease; }
  .gate-input{
    font-family:inherit; font-size:22px; text-align:center; letter-spacing:2px;
    border:3px solid var(--lav); border-radius:24px; padding:14px 18px; width:100%;
  }
  .gate-input:focus{ outline:none; border-color:var(--sakura-d); }
  .review-item{
    background:#fff; border-radius:20px; padding:12px; display:flex; align-items:center; gap:10px;
    box-shadow:0 4px 0 rgba(0,0,0,0.06);
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ===================== GATE SCREEN ===================== -->
<div id="gateScreen" class="screen">
  <div class="panel text-center" style="max-width:520px; background:linear-gradient(160deg,var(--sakura),var(--lav));">
    <div style="font-size:70px;">🔑🌸</div>
    <h1 class="text-3xl font-black mt-2 mb-2">ひみつのことば</h1>
    <p class="mb-6 text-lg">ひみつのことばを入力すると、ゲームがスタートするよ！<br><span class="text-sm text-gray-500">(Please enter the secret keyword to unlock!)</span></p>
    <input id="gateInput" class="gate-input" type="text" placeholder="ひみつのことば" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="gateError" class="text-red-500 font-bold mt-3 hidden">ちがいます。もういちど にゅうりょくしてね。</p>
    <button id="gateBtn" class="btn-round mt-5 px-10 py-4 text-xl" style="background:var(--sakura-d); color:#fff; box-shadow:0 6px 0 #D94E71;">ひらく ▶</button>
  </div>
</div>

<!-- ===================== HOME SCREEN ===================== -->
<div id="homeScreen" class="screen hidden">
  <div class="panel">
    <div class="text-center mb-6">
      <div style="font-size:56px;">🎌✨</div>
      <h1 class="text-3xl font-black">もじクイズ</h1>
      <p class="text-gray-500 mt-1">やりたい モードを えらんでね (Choose a mode)</p>
    </div>
    <div id="modeGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>
</div>

<!-- ===================== QUIZ SCREEN ===================== -->
<div id="quizScreen" class="screen hidden">
  <div class="panel">
    <div class="flex items-center justify-between mb-4">
      <span id="quizModeLabel" class="text-sm font-bold text-gray-500"></span>
      <span id="quizCount" class="text-sm font-bold text-gray-500">1 / 10</span>
    </div>
    <div class="progress-bar mb-6"><div id="progressFill" class="progress-fill" style="width:10%;"></div></div>

    <div class="flex flex-col items-center">
      <div class="flex items-center justify-center gap-6 mb-2">
        <div id="quizChar" class="font-black" style="font-size:120px; color:var(--sakura-d); line-height:1;"></div>
      </div>
      <button id="quizSpeakBtn" class="speak-btn mb-6">🔊</button>

      <p class="mb-3 font-bold text-gray-500">「よみかた」は どれ？ (Which is the reading?)</p>
      <div id="choiceGrid" class="grid grid-cols-2 gap-4 w-full max-w-md mb-6"></div>

      <div id="revealArea" class="flex flex-col items-center hidden w-full">
        <div class="border-t w-full max-w-md mb-5" style="border-color:#eee;"></div>
        <div id="quizEmoji" class="mb-3" style="font-size:70px;"></div>
        <div id="wordRow" class="flex flex-wrap justify-center gap-3 mb-4"></div>
        <div id="quizNote" class="text-sm text-gray-500 mb-4 text-center max-w-md hidden"></div>
        <button id="nextBtn" class="btn-round px-10 py-3 text-lg" style="background:var(--sakura-d); color:#fff; box-shadow:0 6px 0 #D94E71;">つぎへ ▶</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== RESULT SCREEN ===================== -->
<div id="resultScreen" class="screen hidden">
  <div class="panel text-center">
    <div id="resultEmoji" style="font-size:80px;"></div>
    <h1 id="resultTitle" class="text-3xl font-black mt-2 mb-1"></h1>
    <p id="resultScore" class="text-xl font-bold mb-6"></p>

    <h2 id="reviewHeading" class="font-black text-lg mb-3 text-left" style="color:var(--sakura-d);">📋 ふりかえり (Review)</h2>

    <div id="reviewList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6 text-left"></div>

    <div class="flex flex-wrap gap-4 justify-center">
      <button id="retryWrongBtn" class="btn-round px-8 py-3 text-lg hidden" style="background:var(--lav-d); color:#fff; box-shadow:0 6px 0 #6E52C4;">まちがえた もんだいだけ！ 🔄</button>
      <button id="sameModeBtn" class="btn-round px-8 py-3 text-lg" style="background:var(--mint-d); color:#fff; box-shadow:0 6px 0 #2C8A63;">もういちど 🔁</button>
      <button id="homeBtn" class="btn-round px-8 py-3 text-lg" style="background:#fff; color:var(--ink); box-shadow:0 6px 0 #ddd;">ホームへ 🏠</button>
    </div>
  </div>
</div>

<div class="fx-overlay"><div id="fxMark" class="fx-mark"></div></div>

/* =========================================================================
   AUDIO: TTS + beep effects
========================================================================= */
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  jaVoice = voices.find(v => v.lang === 'ja-JP' && /google/i.test(v.name))
        || voices.find(v => v.lang === 'ja-JP') || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speakJa(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if(jaVoice) u.voice = jaVoice;
  u.rate = 0.85; u.pitch = 1.15;
  speechSynthesis.speak(u);
}
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(correct){
  try{
    const ctx = getCtx();
    const notes = correct ? [523.25, 783.99] : [220, 174.6];
    let t = ctx.currentTime;
    notes.forEach((f,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = correct ? 'sine' : 'sawtooth';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.24);
      t += correct ? 0.15 : 0.18;
    });
  }catch(e){ /* audio not available */ }
}

/* =========================================================================
   GATE
========================================================================= */
const gateInput = document.getElementById('gateInput');
const gateBtn = document.getElementById('gateBtn');
const gateError = document.getElementById('gateError');
const MASK_CHAR = '・';
let gateActualValue = '';

/* Mask the visible input as "・・・" while tracking the real typed text
   separately, so the secret keyword is never shown on screen. */
gateInput.addEventListener('input', (e)=>{
  const type = e.inputType || '';
  if(type === 'insertText' || type === 'insertFromPaste' || type === 'insertCompositionText'){
    if(e.data) gateActualValue += e.data;
  } else if(type === 'deleteContentBackward' || type === 'deleteContentForward' || type === 'deleteByCut'){
    gateActualValue = gateActualValue.slice(0, -1);
  } else {
    /* Fallback for browsers that don't report inputType: infer from length change. */
    const shown = e.target.value.replace(new RegExp(MASK_CHAR,'g'), '');
    if(e.target.value.length > gateActualValue.length){
      gateActualValue += shown || '?';
    } else {
      gateActualValue = gateActualValue.slice(0, e.target.value.length);
    }
  }
  gateError.classList.add('hidden');
  e.target.value = MASK_CHAR.repeat(gateActualValue.length);
});

function tryUnlock(){
  const val = gateActualValue.trim().toLowerCase();
  if(val === KEYWORD){
    try{ getCtx(); }catch(e){}
    speechSynthesis.getVoices();
    showScreen('homeScreen');
  } else {
    gateError.classList.remove('hidden');
  }
}
gateBtn.addEventListener('click', tryUnlock);
gateInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });

/* =========================================================================
   SCREEN SWITCH
========================================================================= */
function showScreen(id){
  ['gateScreen','homeScreen','quizScreen','resultScreen'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo(0,0);
}

/* =========================================================================
   HOME
========================================================================= */
const modeGrid = document.getElementById('modeGrid');
MODES.forEach(m=>{
  const btn = document.createElement('button');
  btn.className = 'mode-card';
  btn.style.background = m.bg;
  btn.innerHTML = `<div class="text-2xl font-black">${m.label}</div><div class="text-xs text-gray-500">${m.sub}</div>`;
  btn.addEventListener('click', ()=> startQuiz(m));
  modeGrid.appendChild(btn);
});

/* =========================================================================
   QUIZ ENGINE
========================================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(mode, customItems){
  const fullPool = mode.pool();
  const items = customItems ? customItems : shuffle(fullPool).slice(0, Math.min(10, fullPool.length));
  session = {
    label: mode.label,
    distractorPool: fullPool,
    items,
    idx: 0,
    score: 0,
    answers: [],
    mode
  };
  showScreen('quizScreen');
  renderQuestion();
}

function buildChoices(correctItem){
  const pool = session.distractorPool.filter(x => x.r !== correctItem.r && x.c !== correctItem.c);
  const seenRomaji = new Set([correctItem.r]);
  const distractors = [];
  const shuffled = shuffle(pool);
  for(const cand of shuffled){
    if(distractors.length >= 3) break;
    if(seenRomaji.has(cand.r)) continue;
    seenRomaji.add(cand.r);
    distractors.push(cand.r);
  }
  while(distractors.length < 3){
    distractors.push(correctItem.r + 'x'.repeat(distractors.length+1));
  }
  return shuffle([correctItem.r, ...distractors]);
}

function renderQuestion(){
  const item = session.items[session.idx];
  document.getElementById('quizModeLabel').textContent = session.label;
  document.getElementById('quizCount').textContent = `${session.idx+1} / ${session.items.length}`;
  document.getElementById('progressFill').style.width = `${((session.idx)/session.items.length)*100}%`;

  document.getElementById('quizChar').textContent = item.c;

  document.getElementById('revealArea').classList.add('hidden');
  document.getElementById('quizEmoji').textContent = '';
  document.getElementById('wordRow').innerHTML = '';
  document.getElementById('quizNote').classList.add('hidden');

  const choices = buildChoices(item);
  const grid = document.getElementById('choiceGrid');
  grid.innerHTML = '';
  choices.forEach(choiceRomaji=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choiceRomaji;
    btn.addEventListener('click', ()=> handleAnswer(choiceRomaji, item, btn, grid));
    grid.appendChild(btn);
  });

  document.getElementById('quizSpeakBtn').onclick = ()=> speakJa(`${item.c}！`);
  speakJa(`${item.c}！`);
}

function revealAnswerInfo(item){
  document.getElementById('quizEmoji').textContent = item.e;

  const wordRow = document.getElementById('wordRow');
  wordRow.innerHTML = '';
  item.words.forEach(w=>{
    const chip = document.createElement('div');
    chip.className = 'word-chip';
    chip.innerHTML = `<div class="text-lg font-bold">${w.w}</div><div class="text-xs text-gray-400">${w.r}</div><div class="text-xs text-gray-500">${w.en}</div>`;
    wordRow.appendChild(chip);
  });

  const noteEl = document.getElementById('quizNote');
  if(item.note){ noteEl.textContent = item.note; noteEl.classList.remove('hidden'); }
  else { noteEl.classList.add('hidden'); }

  document.getElementById('revealArea').classList.remove('hidden');
}

function handleAnswer(choiceRomaji, item, btnEl, grid){
  Array.from(grid.children).forEach(b => b.disabled = true);
  const isCorrect = choiceRomaji === item.r;
  btnEl.classList.add(isCorrect ? 'correct' : 'wrong');
  if(!isCorrect){
    Array.from(grid.children).find(b => b.textContent === item.r)?.classList.add('correct');
  }
  beep(isCorrect);
  showFx(isCorrect);
  if(isCorrect) session.score++;
  session.answers.push({item, correct:isCorrect, chosen:choiceRomaji});

  revealAnswerInfo(item);
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  session.idx++;
  if(session.idx < session.items.length){
    renderQuestion();
  } else {
    renderResult();
  }
});

function showFx(correct){
  const mark = document.getElementById('fxMark');
  mark.textContent = correct ? '⭕' : '❌';
  mark.style.color = correct ? '#3FAE83' : '#E05D5D';
  mark.classList.remove('show');
  void mark.offsetWidth;
  mark.classList.add('show');
}

/* =========================================================================
   RESULT
========================================================================= */
function renderResult(){
  showScreen('resultScreen');
  const total = session.items.length;
  const score = session.score;
  const passLine = Math.ceil(total * 0.8);
  const passed = score >= passLine;

  document.getElementById('resultEmoji').textContent = passed ? '💮' : '🌟';
  document.getElementById('resultTitle').textContent = passed
    ? 'クリア！たいへんよくできました！'
    : 'もう一回挑戦してみよう！';
  document.getElementById('resultScore').textContent = `${score} / ${total} もん せいかい`;
  document.getElementById('reviewHeading').textContent = `📋 ふりかえり (Review) — 出題された ${total}もん`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  session.answers.forEach(a=>{
    const row = document.createElement('div');
    row.className = 'review-item';
    const answerLine = a.correct
      ? `<div class="font-bold" style="color:var(--mint-d);">${a.item.r}</div>`
      : `<div class="font-bold" style="color:#E05D5D;">あなたの こたえ: ${a.chosen}</div><div class="font-bold" style="color:var(--mint-d);">せいかい: ${a.item.r}</div>`;
    row.innerHTML = `
      <div style="font-size:34px;">${a.correct ? '✅' : '❌'}</div>
      <div style="font-size:38px; font-weight:900; color:var(--sakura-d);">${a.item.c}</div>
      <div class="flex-1">
        ${answerLine}
        <div class="text-xs text-gray-400">${a.item.words[0] ? a.item.words[0].w + ' (' + a.item.words[0].en + ')' : ''}</div>
      </div>
      <button class="speak-btn" style="width:44px;height:44px;font-size:18px;">🔊</button>
    `;
    row.querySelector('button').addEventListener('click', ()=> speakJa(`${a.item.c}！`));
    reviewList.appendChild(row);
  });

  const wrongItems = session.answers.filter(a=>!a.correct).map(a=>a.item);
  const retryBtn = document.getElementById('retryWrongBtn');
  if(wrongItems.length > 0){
    retryBtn.classList.remove('hidden');
    retryBtn.onclick = ()=> startQuiz(session.mode, shuffle(wrongItems));
  } else {
    retryBtn.classList.add('hidden');
  }

  document.getElementById('sameModeBtn').onclick = ()=> startQuiz(session.mode);
  document.getElementById('homeBtn').onclick = ()=> showScreen('homeScreen');

  if(passed) launchConfetti();
}

function launchConfetti(){
  const colors = ['#FFB7CE','#B7E4C7','#C7B9F0','#FFF3A0','#A7DBF7'];
  for(let i=0;i<80;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const size = 6 + Math.random()*8;
    el.style.width = size+'px';
    el.style.height = (size*0.6)+'px';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    const duration = 2200 + Math.random()*1800;
    const drift = (Math.random()-0.5)*200;
    el.animate([
      { transform: `translate(0,0) rotate(0deg)`, opacity:1 },
      { transform: `translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9 }
    ], { duration, easing:'ease-in' });
    setTimeout(()=> el.remove(), duration+100);
  }
}
